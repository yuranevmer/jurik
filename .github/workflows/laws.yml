# Daily build of the laws repository (README.md: «CI»).
# The download cache (cache/: zakon editions, Rada open data, bill texts) is kept between
# runs in the Actions cache, so a day only downloads what is new; the repository is rebuilt
# from it (deterministically) and pushed to LAWS_REPO by scripts/push-laws.sh.
name: laws

on:
  schedule:
    - cron: "30 2 * * *" # 04:30/05:30 Kyiv time
  workflow_dispatch:

permissions:
  contents: read
  actions: write # keepalive: re-enable this schedule (GitHub turns it off after 60 idle days)

concurrency:
  group: laws
  cancel-in-progress: false

env:
  LAWS_REPO: git@github.com:yuranevmer/jurik-laws.git
  CURRENT_CONVOCATION: 9
  # data.rada.gov.ua does not answer GitHub runners: requests go through an SSH SOCKS
  # tunnel to a VPS that it answers (scripts/setup-proxy-user.sh); empty = no tunnel
  PROXY_HOST: ${{ secrets.PROXY_HOST }} # [user@]host, user jurik-proxy by default
  PROXY_PORT: ${{ secrets.PROXY_PORT }}

jobs:
  build:
    runs-on: ubuntu-latest
    # the first run (empty cache) downloads ~3000 editions and ~7400 bill texts; it may not
    # finish in time: the cache is saved anyway and the next run continues from there
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Install
        run: uv sync --frozen

      - name: Open the proxy tunnel
        if: env.PROXY_HOST != ''
        env:
          PROXY_SSH_KEY: ${{ secrets.PROXY_SSH_KEY }}
          PROXY_KNOWN_HOSTS: ${{ secrets.PROXY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$PROXY_SSH_KEY" > ~/.ssh/proxy_key && chmod 600 ~/.ssh/proxy_key
          printf '%s\n' "$PROXY_KNOWN_HOSTS" >> ~/.ssh/known_hosts
          target="$PROXY_HOST"; [[ "$target" == *@* ]] || target="jurik-proxy@$target"
          ssh -f -N -D 127.0.0.1:1080 -p "${PROXY_PORT:-22}" -i ~/.ssh/proxy_key \
            -o IdentitiesOnly=yes -o ExitOnForwardFailure=yes -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=6 "$target"
          # httpx (jurik) and curl take the proxy from ALL_PROXY; socks5h: DNS on the VPS
          echo "ALL_PROXY=socks5h://127.0.0.1:1080" >> "$GITHUB_ENV"

      # data.rada.gov.ua may not answer some networks: fail in a minute, not after hours of
      # retries on every card
      - name: Check sources are reachable
        run: |
          for url in https://data.rada.gov.ua/laws/card/2947-14.json https://itd.rada.gov.ua/; do
            curl -sS -o /dev/null -m 30 -A OpenData -w "%{http_code} $url\n" "$url" \
              || { echo "::error::$url is not reachable from this runner"; exit 1; }
          done

      - name: Restore download cache
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: jurik-cache-${{ github.run_id }}
          restore-keys: jurik-cache-

      - name: Fetch new editions
        run: uv run jurik fetch

      - name: Rada open data
        run: |
          uv run jurik rada
          uv run jurik rada --convocation "$CURRENT_CONVOCATION" --refetch

      - name: Build
        run: uv run jurik build --out build/laws

      - name: Save download cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cache
          key: jurik-cache-${{ github.run_id }}

      - name: Push
        env:
          LAWS_DEPLOY_KEY: ${{ secrets.LAWS_DEPLOY_KEY }}
        run: scripts/push-laws.sh

      - name: Keep the schedule alive
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/laws.yml/enable"
