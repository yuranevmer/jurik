# Daily build of the laws repository (README.md: «CI»).
# Runs on a self-hosted runner (label "jurik", scripts/setup-runner.sh) on a VPS that
# data.rada.gov.ua answers (it does not answer GitHub-hosted runners). The download cache
# lives on the runner's disk (JURIK_CACHE), so a day only downloads what is new; the
# repository is rebuilt from it (deterministically) and pushed to LAWS_REPO by
# scripts/push-laws.sh.
name: laws

on:
  schedule:
    - cron: "30 2 * * *" # 04:30/05:30 Kyiv time
  workflow_dispatch:

permissions:
  contents: read
  actions: write # keepalive: re-enable this schedule (GitHub turns it off after 60 idle days)

concurrency:
  group: laws
  cancel-in-progress: false

env:
  LAWS_REPO: git@github.com:yuranevmer/jurik-laws.git
  CURRENT_CONVOCATION: 9

jobs:
  build:
    runs-on: [self-hosted, linux, jurik]
    # the first run with an empty cache downloads ~3500 editions and ~7400 bill texts
    timeout-minutes: 1200
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true

      - uses: astral-sh/setup-uv@v6

      - name: Install
        run: uv sync --frozen

      # the cache survives between runs outside the checkout (default ~/jurik-cache)
      - name: Link the download cache
        run: |
          dir="${JURIK_CACHE:-$HOME/jurik-cache}"
          mkdir -p "$dir"
          ln -sfn "$dir" cache

      # fail in a minute, not after hours of retries on every card
      - name: Check sources are reachable
        run: |
          for url in https://data.rada.gov.ua/laws/card/2947-14.json https://itd.rada.gov.ua/; do
            curl -sS -o /dev/null -m 30 --retry 3 --retry-all-errors -A OpenData \
              -w "%{http_code} $url\n" "$url" \
              || { echo "::error::$url is not reachable from this runner"; exit 1; }
          done

      - name: Fetch new editions
        run: uv run jurik fetch

      - name: Rada open data
        run: |
          uv run jurik rada
          uv run jurik rada --convocation "$CURRENT_CONVOCATION" --refetch

      - name: Build
        run: uv run jurik build --out build/laws

      - name: Push
        env:
          LAWS_DEPLOY_KEY: ${{ secrets.LAWS_DEPLOY_KEY }}
        run: scripts/push-laws.sh

      - name: Keep the schedule alive
        if: always()
        env:
          TOKEN: ${{ github.token }}
        run: |
          curl -sS -f -X PUT -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/laws.yml/enable"
