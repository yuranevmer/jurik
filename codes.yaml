# Registry of codes built into build/laws.
#
# Verification (Task 1, 2026-10-25): every zakon_id below was opened as
# https://zakon.rada.gov.ua/laws/card/<id> (HTTP 200) and the page <title> matched the
# code. zakon truncates long titles with "..."; the visible prefix matched in all cases.
# Notes:
#   - 80731-10 and 80732-10 are the two parts of КУпАП, both titled
#     "Кодекс України про адміністра..." від 07.12.1984 № 8073-X.
#   - 132/94-ВР card title is "Про надра" від 27.07.1994; the citation on the card reads
#     "Кодекс України; Закон, Кодекс ... № 132/94-ВР", i.e. Кодекс України про надра.
#   - 436-15 (Господарський кодекс) is repealed in 2025; kept for history.
#   - 4651-17 responds gzip-compressed even without Accept-Encoding; client must decode.
#
# title_patterns (Task 11): regexes matched case-insensitively against bill titles (any
# grammatical case, whitespace collapsed) to find bills about a code; see jurik/rada/match.py.
# The optional «(та|і|й) <1-2 words>» group catches elliptic lists such as
# «Кримінального та Кримінального процесуального кодексів», «Податкового і Митного кодексів».

- slug: constitution
  zakon_id: "254к/96-ВР"
  title: Конституція України        # verified: від 28.06.1996 № 254к/96-ВР
  title_patterns: ['конституці(я|ї|ю|єю)\s+україни']
